name: "vg-dc-mgmt"
arch: "amd64"
platform: "linux"
version: ${PACKAGE_VERSION}
section: "default"
priority: "optional"
release: ${PACKAGE_RELEASE}

provides:
- vg-dc-mgmt
depends:
- openssh-client
- sudo
- postgresql
- jq

maintainer: "Ingmund Ollson <ingmund@proton.me>"
description: VPNGen datacenter management
vendor: "VPNGen"
homepage: "http://vpngen.org"
license: "LGPL"

